name: tum
description: "TUM BY AHMAD JAMIL"
publish_to: 'none'
version: 4.0.3+11

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.8.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  permission_handler: ^12.0.3
  flutter_upgrade_version: ^1.1.9
  lottie: ^3.1.2
  supabase_flutter: ^2.10.0
  sqflite: ^2.4.2
  path: ^1.9.1
  share_plus: ^11.0.0
  google_nav_bar: ^5.0.7
  firebase_core:
  firebase_messaging:
  flutter_local_notifications:
  skeletonizer: ^2.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#140E0A"
  adaptive_icon_foreground: assets/logo/logo.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
